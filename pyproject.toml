[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytionlib"
version = "0.1.1"
description = "A library that adds some actions"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Behind Games"}
]

[tool.setuptools.packages.find]
where = ["src"]